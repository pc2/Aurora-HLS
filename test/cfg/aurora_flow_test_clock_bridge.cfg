[connectivity]
nk=aurora_flow_0:1:aurora_flow_0
nk=aurora_flow_1:1:aurora_flow_1
nk=aurora_flow_clock_bridge:2:clock_bridge_0,clock_bridge_1
nk=send:2:send_0,send_1
nk=recv:2:recv_0,recv_1

# HLS is 512 bits at 300 MHz. Each bridge reuses AuroraFlow's asynchronous
# FIFO and data-width conversion path to present 256-bit streams at 400 MHz.
stream_connect=send_0.data_output:clock_bridge_0.hls_tx
stream_connect=clock_bridge_0.aurora_tx:aurora_flow_0.tx_axis
stream_connect=aurora_flow_0.rx_axis:clock_bridge_0.aurora_rx
stream_connect=clock_bridge_0.hls_rx:recv_0.data_input

stream_connect=send_1.data_output:clock_bridge_1.hls_tx
stream_connect=clock_bridge_1.aurora_tx:aurora_flow_1.tx_axis
stream_connect=aurora_flow_1.rx_axis:clock_bridge_1.aurora_rx
stream_connect=clock_bridge_1.hls_rx:recv_1.data_input

stream_connect=recv_0.loopback_ack_stream:send_0.loopback_ack_stream
stream_connect=recv_1.loopback_ack_stream:send_1.loopback_ack_stream

stream_connect=recv_0.pair_ack_stream:send_1.pair_ack_stream
stream_connect=recv_1.pair_ack_stream:send_0.pair_ack_stream
