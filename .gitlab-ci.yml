# AuroraFlow CI: fast checks use native GitLab jobs; expensive Vitis and FPGA
# matrices use content-addressed hpc-ci result sets.
stages:
  - check
  - sw-emu-build
  - sw-emu-run
  - hw-emu-build
  - hw-emu-run
  - hw-build
  - hw-run
  - benchmark
  - collect

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  ACCOUNT: "pc2-mitarbeiter"
  LOCAL_RUNNER_TAG: "noctua2-shell"
  SLURM_RUNNER_TAG: "noctua2-slurm"
  HPC_CI_PACKAGE_NAME: "aurora-flow"
  HPC_CI_PACKAGE_VERSION: "1.0.0"
  HPC_CI_STORAGE_DIR: "/scratch/pc2-mitarbeiter/papeg/hpc-ci"
  GIT_SUBMODULE_STRATEGY: none

default:
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de

include:
  - component: $CI_SERVER_FQDN/pc2-ci/hpc-ci-component/matrix-step@main
    inputs:
      job_name: "sw-emu-build"
      stage: "sw-emu-build"
      command_files: "ci/build-xclbin.sh"
      matrix_file: "ci/matrix/sw-emu-build.txt"
      source_paths: >-
        Makefile aurora_flow.mk cmake hls include rtl tcl
        test/CMakeLists.txt test/Makefile test/cfg test/hls xdc
      env_file: "env.sh"
      precheck_runner_tag: "$LOCAL_RUNNER_TAG"
      slurm_runner_tag: "$SLURM_RUNNER_TAG"
      slurm_parameters: >-
        -A $ACCOUNT -p normal -t 00:15:00
        --cpus-per-task=8 --mem=32G
      publish_paths: >-
        aurora_flow_test_sw_emu_{BUILD_SYS}_f{FRAMING}_w{WIDTH}_xrt{XRT}.xclbin
        emconfig.json
      failure_paths: "*.log *.jou build/**/*.log"
      failure_policy: "fail"

  - component: $CI_SERVER_FQDN/pc2-ci/hpc-ci-component/matrix-step@main
    inputs:
      job_name: "sw-emu-run"
      stage: "sw-emu-run"
      command_files: "ci/run-emu.sh"
      matrix_file: "ci/matrix/sw-emu-run.txt"
      source_paths: >-
        Makefile aurora_flow.mk cmake include
        test/CMakeLists.txt test/Makefile test/host test/scripts
      env_file: "env.sh"
      upstream_inputs: >-
        sw-emu-build,paths=aurora_flow_test_sw_emu_{BUILD_SYS}_f{FRAMING}_w{WIDTH}_xrt{XRT}.xclbin emconfig.json
      precheck_runner_tag: "$LOCAL_RUNNER_TAG"
      slurm_runner_tag: "$SLURM_RUNNER_TAG"
      slurm_parameters: >-
        -A $ACCOUNT -p normal -t 00:15:00
        -n {RUN_RANKS} --cpus-per-task=1 --mem=16G
      publish_paths: "emu-run.log"
      extract_paths: "emu-run.log"
      failure_paths: "*.log run/**/*.log"
      failure_policy: "fail"

  - component: $CI_SERVER_FQDN/pc2-ci/hpc-ci-component/matrix-step@main
    inputs:
      job_name: "hw-emu-build"
      stage: "hw-emu-build"
      command_files: "ci/build-xclbin.sh"
      matrix_file: "ci/matrix/hw-emu-build.txt"
      source_paths: >-
        Makefile aurora_flow.mk cmake include rtl tcl xdc
        test/CMakeLists.txt test/Makefile test/cfg test/hls test/rtl test/tcl
        test/scripts/check_clock_bridge_link.sh
      env_file: "env.sh"
      precheck_runner_tag: "$LOCAL_RUNNER_TAG"
      slurm_runner_tag: "$SLURM_RUNNER_TAG"
      slurm_parameters: >-
        -A $ACCOUNT -p normal --qos=fpgasynthesis -t 00:45:00
        --cpus-per-task=8 --mem=32G
      publish_paths: >-
        aurora_flow_test_hw_emu_{BUILD_SYS}_f{FRAMING}_w{WIDTH}_a{AXI_CLOCK_HZ}_gt{HW_EMU_GT_CLOCK_HZ}_clocks{HW_EMU_CLOCKS}_xrt{XRT}.xclbin
        emconfig.json
      failure_paths: "*.log *.jou build/**/*.log"
      failure_policy: "fail"

  - component: $CI_SERVER_FQDN/pc2-ci/hpc-ci-component/matrix-step@main
    inputs:
      job_name: "hw-emu-run"
      stage: "hw-emu-run"
      command_files: "ci/run-emu.sh"
      matrix_file: "ci/matrix/hw-emu-run.txt"
      source_paths: >-
        Makefile aurora_flow.mk cmake include
        test/CMakeLists.txt test/Makefile test/host test/scripts
      env_file: "env.sh"
      upstream_inputs: >-
        hw-emu-build,paths=aurora_flow_test_hw_emu_{BUILD_SYS}_f{FRAMING}_w{WIDTH}_a{AXI_CLOCK_HZ}_gt{HW_EMU_GT_CLOCK_HZ}_clocks{HW_EMU_CLOCKS}_xrt{XRT}.xclbin emconfig.json
      precheck_runner_tag: "$LOCAL_RUNNER_TAG"
      slurm_runner_tag: "$SLURM_RUNNER_TAG"
      slurm_parameters: >-
        -A $ACCOUNT -p normal -t 00:30:00
        -n {RUN_RANKS} --cpus-per-task=1 --mem=64G
      publish_paths: "emu-run.log"
      extract_paths: "emu-run.log"
      failure_paths: "*.log run/**/*.log run/**/xsim*.log"
      failure_policy: "fail"

  - component: $CI_SERVER_FQDN/pc2-ci/hpc-ci-component/matrix-step@main
    inputs:
      job_name: "hw-build"
      stage: "hw-build"
      command_files: "ci/build-xclbin.sh ci/check-timing.sh"
      matrix_file: "ci/matrix/hw-build.txt"
      source_paths: >-
        Makefile aurora_flow.mk ci/check-timing.py cmake include rtl tcl xdc
        test/CMakeLists.txt test/Makefile test/cfg test/hls test/rtl test/tcl
        test/scripts/check_clock_bridge_link.sh
      env_file: "env.sh"
      precheck_runner_tag: "$LOCAL_RUNNER_TAG"
      slurm_runner_tag: "$SLURM_RUNNER_TAG"
      slurm_parameters: >-
        -A $ACCOUNT -p normal --qos=fpgasynthesis -t 08:00:00
        --cpus-per-task=8 --mem=64G
      publish_paths: >-
        aurora_flow_test_hw_{BUILD_SYS}_f{FRAMING}_w{WIDTH}_a{AXI_CLOCK_HZ}_xrt{XRT}.xclbin
        clock.cfg timing.json timing-reports
      extract_paths: "clock.cfg timing.json timing-reports/*.rpt"
      failure_paths: >-
        *.log *.jou timing.json timing-reports
        build/**/*.log build/**/*.jou build/**/*timing*.rpt
      failure_policy: "fail"

  - component: $CI_SERVER_FQDN/pc2-ci/hpc-ci-component/matrix-step@main
    inputs:
      job_name: "hw-run"
      stage: "hw-run"
      command_files: "ci/run-hw.sh"
      matrix_file: "ci/matrix/hw-run.txt"
      source_paths: >-
        Makefile aurora_flow.mk include
        test/Makefile test/host test/scripts
      env_file: "env.sh"
      upstream_inputs: >-
        hw-build,paths=aurora_flow_test_hw_{BUILD_SYS}_f{FRAMING}_w{WIDTH}_a{AXI_CLOCK_HZ}_xrt{XRT}.xclbin
      precheck_runner_tag: "$LOCAL_RUNNER_TAG"
      slurm_runner_tag: "$SLURM_RUNNER_TAG"
      slurm_parameters: >-
        -A $ACCOUNT -p fpga -t 00:15:00 -N 1 -n 6
        --constraint=xilinx_u280_xrt{XRT}
      publish_paths: "results.csv hw-run.log"
      extract_paths: "results.csv hw-run.log"
      failure_paths: "*.log *.csv run/**/*.log run/**/*.csv"
      failure_policy: "fail"

  - component: $CI_SERVER_FQDN/pc2-ci/hpc-ci-component/matrix-step@main
    inputs:
      job_name: "benchmark"
      stage: "benchmark"
      command_files: "ci/benchmark.sh"
      matrix_file: "ci/matrix/benchmark.txt"
      source_paths: >-
        Makefile aurora_flow.mk include
        test/Makefile test/host test/scripts
      env_file: "env.sh"
      upstream_inputs: >-
        hw-build,paths=aurora_flow_test_hw_{BUILD_SYS}_f{FRAMING}_w{WIDTH}_a{AXI_CLOCK_HZ}_xrt{XRT}.xclbin
      precheck_runner_tag: "$LOCAL_RUNNER_TAG"
      slurm_runner_tag: "$SLURM_RUNNER_TAG"
      slurm_parameters: >-
        -A $ACCOUNT -p fpga -t 01:30:00 -N 1 -n 6
        --constraint=xilinx_u280_xrt{XRT}
      publish_paths: "benchmark.csv benchmark.log"
      extract_paths: "benchmark.csv benchmark.log"
      failure_paths: "*.log *.csv run/**/*.log run/**/*.csv"
      failure_policy: "fail"

  - component: $CI_SERVER_FQDN/pc2-ci/hpc-ci-component/collect@main
    inputs:
      base_job_name: ".aurora-flow-results"
      index_glob: "hw-build-index.json hw-run-index.json benchmark-index.json"
      mode: "extracts"
      staging_dir: "collected"

.hw-only:
  rules:
    - if: '$SKIP_HW == "true"'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip hw\]/'
      when: never
    - when: on_success

.after-partial-build:
  rules:
    - when: always

.hw-after-partial-build:
  rules:
    - if: '$SKIP_HW == "true"'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip hw\]/'
      when: never
    - when: always

check:rtl:
  stage: check
  tags: [$LOCAL_RUNNER_TAG]
  timeout: 1h
  needs: []
  parallel:
    matrix:
      - TB: [nfc, monitor, configuration, control_s_axi]
  before_script:
    - source env.sh
  script:
    - make "run_${TB}_tb"
    # xsim can return zero after an internal Tcl/launch error, so the log is
    # part of the pass criterion rather than relying on the process status.
    - '! grep -q ''^ERROR:'' xsim.log'
  artifacts:
    paths:
      - "${TB}_tb.wdb"
      - "${TB}_tb.vcd"
      - "*.log"
    when: on_failure

check:host:
  stage: check
  tags: [$LOCAL_RUNNER_TAG]
  timeout: 1h
  needs: []
  parallel:
    matrix:
      - BUILD_SYS: [make, cmake]
        XRT: ["2.14", "2.15", "2.16"]
  before_script:
    - source env.sh
  script:
    - |
      if [[ "$BUILD_SYS" == "make" ]]; then
        make -C test BUILD_DIR="$CI_PROJECT_DIR/build-host" host
      else
        cmake -S test -B build-host
        cmake --build build-host --parallel 8 --target host_aurora_flow_test
      fi

sw-emu-build-precheck:
  needs: ["check:rtl", "check:host"]
sw-emu-run-precheck:
  extends: .after-partial-build
  needs:
    - job: sw-emu-build-precheck
      artifacts: true
    - job: sw-emu-build
      artifacts: false

hw-emu-build-precheck:
  needs: ["check:rtl", "check:host"]
hw-emu-run-precheck:
  extends: .after-partial-build
  needs:
    - job: hw-emu-build-precheck
      artifacts: true
    - job: hw-emu-build
      artifacts: false

hw-build-precheck:
  extends: .hw-only
  needs: ["check:rtl", "check:host"]
hw-build:
  extends: .hw-only

hw-run-precheck:
  extends: .hw-after-partial-build
  needs:
    - job: hw-build-precheck
      artifacts: true
    - job: hw-build
      artifacts: false
hw-run:
  extends: .hw-only

benchmark-precheck:
  extends: .hw-after-partial-build
  needs:
    - job: hw-build-precheck
      artifacts: true
    - job: hw-build
      artifacts: false
benchmark:
  extends: .hw-only

results:collect:
  extends:
    - .aurora-flow-results
    - .hw-after-partial-build
  stage: collect
  tags: [$LOCAL_RUNNER_TAG]
  needs:
    - job: hw-build-precheck
      artifacts: true
    - job: hw-build
      artifacts: false
    - job: hw-run-precheck
      artifacts: true
    - job: hw-run
      artifacts: false
    - job: benchmark-precheck
      artifacts: true
    - job: benchmark
      artifacts: false
  script:
    - test -s "$HPC_CI_RESULTS_FILE"
  artifacts:
    paths:
      - collected/**/*
    when: always
    expire_in: 1 month
